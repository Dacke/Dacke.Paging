name: Publish NuGet Packages

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*' # Trigger publish on release tags (e.g., v1.0.0)
  pull_request:
    branches: [ "master" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write # Required for NuGet OIDC authentication
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Ensures tag history is available for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Extract Tag Version
      id: get_version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore ./src/EFCorePaging.slnx

    - name: Build & Package (Release)
      run: |
        PKG_VERSION="${{ steps.get_version.outputs.VERSION }}"
        if [ -z "$PKG_VERSION" ]; then
          PKG_VERSION="1.0.0-preview"
        fi
        
        dotnet build ./src/EFCorePaging.slnx \
          --configuration Release \
          --no-restore \
          /p:PackageVersion=$PKG_VERSION

    - name: Run Unit Tests
      run: dotnet test ./src/Paging.UnitTests/Paging.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: NuGet Login (OIDC)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USERNAME }}

    - name: Publish NuGet Packages
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet nuget push ./src/**/bin/Release/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
