# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./src/Dacke.Paging.slnx
    - name: Build
      run: dotnet build ./src/Dacke.Paging.slnx --no-restore
    - name: Test
      run: dotnet test --project ./src/Dacke.Paging.UnitTests/Dacke.Paging.UnitTests.csproj --no-build
    - name: Test Endpoints
      run: dotnet test --project ./src/Dacke.Paging.Sample.Web.Tests/Dacke.Paging.Sample.Web.Tests.csproj --no-build
